<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<style>
 * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;
  font-size: 17px;
}

#myVideo {
    position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%; 
  min-height: 100%;
}

.content {
  position: fixed;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  color: #f1f1f1;
  width: 100%;
  padding: 20px;
}
.bless{
    display:flex;
    position: relative;
    padding: 10rem;
}
.bless div{
    background-color: #f1f1f1;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}

#yalla {
    width: 100%;
  padding: 20px;
}
#myBtn {
  width: 200px;
  font-size: 18px;
  padding: 10px;
  border: none;
  background: #000;
  color: #fff;
  cursor: pointer;
}

#myBtn:hover {
  background: #ddd;
  color: black;
}
.flip-card {

  background-color: transparent;
  width: 300px;
  height: 300px;
  border: 1px solid #f1f1f1;
  perspective: 1000px; /* Remove this if you don't want the 3D effect */
}

/* This container is needed to position the front and back side */
.flip-card-inner {

  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}

/* Do an horizontal flip when you move the mouse over the flip box container */
.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}
#lol {
    position: relative;
    margin-right: 16rem;
    width: 350px;
    height: 350px;
}
/* Position the front and back side */
.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden; /* Safari */
  backface-visibility: hidden;
}

/* Style the front side (fallback if image is missing) */
.flip-card-front {
  background-color: #bbb;
  color: black;
}

/* Style the back side */
.flip-card-back {
background-image: url('public/walter-white-2.png');
  color: black;
  font: bold;
  transform: rotateY(180deg);
}
</style>

<body>

    <video autoplay loop id="myVideo">
        <source src="20dollar.mp4" type="video/mp4">
      
    </video>
  <div class="content">
    <h1>Baldjeet Bombo</h1>
    <h2>yk kno me son</h2>
    <button id="myBtn" onclick="myFunction()">Pause</button>
 <a href="https://www.youtube.com/watch?v=6aie4t8lZ7k">I am the one who knocks</a>
 
   
</div>
<div class="bless">
<div>
<img src="public/breaking_bad_walter_white_purity_patron_post.webp" id="lol" alt="lol">
</div>
<div>
    <img src="public/hqdefault.webp" alt="">
</div>
<div>
    <img src="public/887.jpg" id="lol">
</div>
<div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="public/walter-white-3.png" alt="Avatar" style="width:300px;height:300px;">
      </div>
      <div class="flip-card-back">

        <h1>waltuh</h1>
        <p></p>
        <p>We love that guy</p>
      </div>
    </div>
</div>
</div>
<div class="yalla">

</div>
 
</body>
<script>
    // Get the video
    var video = document.getElementById("myVideo");
    
    // Get the button
    var btn = document.getElementById("myBtn");
    
    // Pause and play the video, and change the button text
    function myFunction() {
      if (video.paused) {
        video.play();
        btn.innerHTML = "Pause";
      } else {
        video.pause();
        btn.innerHTML = "Play";
      }
    }
    </script>
</html>
